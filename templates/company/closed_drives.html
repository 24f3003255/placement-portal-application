{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Closed Job Drives</h2>
    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Job Title</th>
                <th>Location</th>
                <th>Package</th>
                <th>Last Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        {% for drive in drives %}
            <tr>
                <td>{{ drive.job_title }}</td>
                <td>{{ drive.location }}</td>
                <td>{{ drive.salary_package }}</td>
                <td>{{ drive.last_date_to_apply }}</td>
                <td>
                    <form action="{{ url_for('activate_drive', JD_id=drive.JD_id) }}"
                          method="POST">
                        <button class="btn btn-success btn-sm">
                            Activate
                        </button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
