{% extends "base.html" %}

{% block title %}
Update Profile - Placement Portal
{% endblock %}
{% block content %}
<div class="container mt-4">
    <h3 class="mb-4">Update Profile</h3>
    <form method="POST" action="{{ url_for('student_update_profile') }}" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="student_name" class="form-label">Name</label>
            <input type="text" class="form-control" id="student_name" name="student_name" value="{{ student.student_name }}">
        </div>
        <div class="mb-3">
            <label for="email_address" class="form-label">Email Address-same as registered mail_id</label>
            <input type="email" class="form-control" id="email_address" name="email_address" value="{{ student.email_address }}">
        </div>
        <div class="mb-3">
            <label for="contact_number" class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="contact_number" name="contact_number" value="{{ student.contact_number }}">
        </div>
        <div class="mb-3">
            <label for="branch" class="form-label">Branch</label>
            <input type="text" class="form-control" id="branch" name="branch" value="{{ student.branch }}">
        </div>
        <div class="mb-3">
            <label for="academic_year" class="form-label">Academic Year</label>
            <input type="text" class="form-control" id="academic_year" name="academic_year" value="{{ student.academic_year }}">
        </div>
        <div class="mb-3">
            <label for="cgpa" class="form-label">CGPA</label>
            <input type="text" class="form-control" id="cgpa" name="cgpa" value="{{ student.cgpa }}">
        </div>
        <div class="mb-3">
            <label for="resume_file" class="form-label">Upload Resume -filename should be resume_file </label>
            <input type="file" class="form-control" id="resume_file" name="resume_file">
        </div>
        {% if student.resume_file %}
        <div class="mb-3">
            <label class="form-label">Current Resume</label><br>
            <a href="{{ url_for('static', filename='resumes/' + student.resume_file) }}" target="_blank">
                View Uploaded Resume
            </a>
        </div>
        {% endif %}
        <div class="mb-3">
            <label for="educational_qualifications" class="form-label">
                Educational Qualifications
            </label>
            <textarea class="form-control" id="educational_qualifications" name="educational_qualifications" rows="4">{{ student.educational_qualifications }}</textarea>
        </div>
        <div class="mb-3">
            <label for="skills" class="form-label">Skills</label>
            <textarea class="form-control" id="skills" name="skills" rows="4">{{ student.skills }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">
            Update Profile
        </button>
    </form>
</div>
{% endblock %}
